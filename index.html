<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Primera Landing Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background-color: #0f0f0f; color: white; text-align: center; }
    .hero { padding: 80px 20px; background: linear-gradient(135deg, #1a1a2e, #16213e); }
    h1 { font-size: 42px; margin-bottom: 20px; color: #e94560; }
    p { font-size: 18px; margin-bottom: 40px; color: #aaaaaa; }
    button { padding: 18px 40px; background-color: #e94560; color: white; border: none; border-radius: 8px; font-size: 20px; cursor: pointer; }
    .beneficios { display: flex; justify-content: center; gap: 20px; padding: 50px 20px; flex-wrap: wrap; }
    .card { background: #1a1a2e; padding: 30px; border-radius: 12px; font-size: 18px; width: 200px; }
  </style>
</head>
<body>

  <div class="hero">
    <h1>El producto que cambiará tu rutina</h1>
    <p>Envío gratis · Garantía 30 días · Más de 10.000 clientes felices</p>
    <button onclick="alert('¡Gracias por tu interés! 🛒')">¡Quiero el mío ahora!</button>
  </div>

  <div class="beneficios">
    <div class="card">⚡ Resultado en 7 días</div>
    <div class="card">🚚 Envío gratis a toda España</div>
    <div class="card">💯 Garantía total</div>
  </div>

</body>
</html>
